version: "3.9"

services:
  api:
    build: .
    container_name: npm-hallucination-detector
    ports:
      - "8000:8000"
    volumes:
      - ./models:/app/models   # 학습된 pkl 마운트 (재빌드 불필요)
    environment:
      - PYTHONUNBUFFERED=1
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3
